<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Punto de venta para boutique">
  <defs><linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13243f"/><stop offset="1" stop-color="#0a1424"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#pb)"/>
  <circle cx="650" cy="100" r="150" fill="#c2a14d" opacity="0.11"/>
  <!-- terminal POS -->
  <g transform="translate(250,90)">
    <rect x="0" y="0" width="300" height="190" rx="14" fill="#0f1d33" stroke="#2b4470" stroke-width="2"/>
    <rect x="16" y="16" width="268" height="120" rx="8" fill="#13243f"/>
    <!-- ticket en pantalla -->
    <rect x="36" y="34" width="150" height="10" rx="5" fill="#2b4470"/>
    <rect x="36" y="54" width="120" height="8" rx="4" fill="#1d3360"/>
    <rect x="36" y="72" width="140" height="8" rx="4" fill="#1d3360"/>
    <rect x="36" y="98" width="90" height="20" rx="6" fill="#c2a14d"/>
    <!-- prendas -->
    <g transform="translate(210,40)" stroke="#d8b864" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 8 a6 6 0 1 1 6 6 v6"/>
      <path d="M20 20 L4 36 L4 70 L36 70 L36 36 Z"/>
    </g>
    <!-- teclado / base -->
    <rect x="0" y="150" width="300" height="40" rx="8" fill="#16294a"/>
    <g fill="#24406f"><rect x="20" y="162" width="40" height="16" rx="4"/><rect x="72" y="162" width="40" height="16" rx="4"/><rect x="124" y="162" width="40" height="16" rx="4"/><rect x="226" y="162" width="54" height="16" rx="4" fill="#c2a14d"/></g>
  </g>
  <!-- etiqueta de precio -->
  <g transform="translate(150,300) rotate(-12)">
    <path d="M0 20 L26 0 L120 0 L120 56 L26 56 Z" fill="#c2a14d"/>
    <circle cx="30" cy="28" r="7" fill="#0a1424"/>
    <text x="78" y="36" font-family="'Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#20180a" text-anchor="middle">$</text>
  </g>
  <text x="400" y="430" font-family="'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#eaeefb" text-anchor="middle">POS Boutique</text>
  <text x="400" y="458" font-family="'Segoe UI',sans-serif" font-size="15" fill="#7d8db0" text-anchor="middle">Ventas · Tallas/colores · Tickets · Caja</text>
</svg>
