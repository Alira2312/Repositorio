<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Punto de venta de donas y café">
  <defs><linearGradient id="pd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13243f"/><stop offset="1" stop-color="#0a1424"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#pd)"/>
  <circle cx="160" cy="110" r="150" fill="#c2a14d" opacity="0.11"/>
  <!-- dona -->
  <g transform="translate(250,150)">
    <circle cx="0" cy="0" r="78" fill="#7a4a25"/>
    <path d="M-78 0 a78 78 0 0 1 156 0 a78 40 0 0 0 -156 0" fill="#e9a0c0"/>
    <circle cx="0" cy="0" r="28" fill="#0a1424"/>
    <g fill="#fff"><rect x="-50" y="-30" width="10" height="4" rx="2" transform="rotate(30)"/><rect x="20" y="-44" width="10" height="4" rx="2" transform="rotate(-20)"/><rect x="40" y="10" width="10" height="4" rx="2" transform="rotate(50)"/></g>
    <g fill="#d8b864"><rect x="-20" y="-50" width="10" height="4" rx="2"/><rect x="44" y="-10" width="10" height="4" rx="2" transform="rotate(80)"/><rect x="-46" y="20" width="10" height="4" rx="2" transform="rotate(-30)"/></g>
  </g>
  <!-- café -->
  <g transform="translate(420,120)">
    <path d="M0 40 L100 40 L92 150 a12 12 0 0 1 -12 11 L20 161 a12 12 0 0 1 -12 -11 Z" fill="#0f1d33" stroke="#2b4470" stroke-width="2"/>
    <rect x="-6" y="26" width="112" height="18" rx="9" fill="#c2a14d"/>
    <!-- vapor -->
    <g stroke="#7d8db0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M34 12 q8 -10 0 -20"/><path d="M58 12 q8 -10 0 -20"/>
    </g>
  </g>
  <text x="400" y="430" font-family="'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#eaeefb" text-anchor="middle">POS Donas &amp; Café</text>
  <text x="400" y="458" font-family="'Segoe UI',sans-serif" font-size="15" fill="#7d8db0" text-anchor="middle">Menú · Combos · Ventas rápidas · Corte de caja</text>
</svg>
