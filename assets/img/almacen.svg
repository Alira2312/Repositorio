<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Proceso de almacén e inventarios">
  <defs><linearGradient id="al" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13243f"/><stop offset="1" stop-color="#0a1424"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#al)"/>
  <circle cx="650" cy="110" r="150" fill="#c2a14d" opacity="0.11"/>
  <!-- estantería -->
  <g transform="translate(120,90)" stroke="#2b4470" stroke-width="3" fill="none">
    <rect x="0" y="0" width="320" height="270" rx="6"/>
    <line x1="0" y1="90" x2="320" y2="90"/><line x1="0" y1="180" x2="320" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="270"/>
  </g>
  <g transform="translate(120,90)">
    <!-- cajas en estantes -->
    <rect x="18" y="46" width="56" height="40" rx="4" fill="#c2a14d"/>
    <rect x="86" y="40" width="56" height="46" rx="4" fill="#1d3360"/>
    <rect x="178" y="50" width="56" height="36" rx="4" fill="#1d3360"/>
    <rect x="246" y="44" width="56" height="42" rx="4" fill="#c2a14d" opacity="0.6"/>
    <rect x="20" y="134" width="56" height="42" rx="4" fill="#1d3360"/>
    <rect x="88" y="130" width="56" height="46" rx="4" fill="#c2a14d" opacity="0.6"/>
    <rect x="176" y="136" width="56" height="40" rx="4" fill="#c2a14d"/>
    <rect x="246" y="138" width="56" height="38" rx="4" fill="#1d3360"/>
  </g>
  <!-- montacargas -->
  <g transform="translate(470,250)">
    <rect x="0" y="20" width="90" height="60" rx="8" fill="#c2a14d"/>
    <rect x="58" y="-6" width="40" height="40" rx="6" fill="#16294a" stroke="#2b4470" stroke-width="2"/>
    <!-- mástil + horquilla -->
    <rect x="100" y="-30" width="8" height="110" fill="#24406f"/>
    <path d="M108 70 L150 70" stroke="#24406f" stroke-width="8" stroke-linecap="round"/>
    <rect x="116" y="30" width="44" height="34" rx="4" fill="#1d3360"/>
    <!-- ruedas -->
    <circle cx="22" cy="86" r="14" fill="#0a1424" stroke="#2b4470" stroke-width="3"/>
    <circle cx="72" cy="86" r="14" fill="#0a1424" stroke="#2b4470" stroke-width="3"/>
  </g>
  <text x="400" y="430" font-family="'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#eaeefb" text-anchor="middle">Proceso de Almacén</text>
  <text x="400" y="458" font-family="'Segoe UI',sans-serif" font-size="15" fill="#7d8db0" text-anchor="middle">Recepción · Acomodo · Conteos cíclicos · Surtido</text>
</svg>
