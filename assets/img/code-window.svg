<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Editor de código mostrando código">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14233f"/>
      <stop offset="1" stop-color="#0c1830"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2a14d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2a14d" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#04080f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- halo dorado -->
  <circle cx="560" cy="70" r="150" fill="url(#glow)"/>

  <!-- ventana del editor -->
  <g filter="url(#shadow)">
    <rect x="60" y="70" width="520" height="340" rx="16" fill="url(#bg)" stroke="#28406b" stroke-width="1.5"/>
    <!-- barra de título -->
    <path d="M60 86 a16 16 0 0 1 16 -16 h488 a16 16 0 0 1 16 16 v22 h-520 z" fill="#0f1d33"/>
    <circle cx="84" cy="92" r="6" fill="#ff5f57"/>
    <circle cx="104" cy="92" r="6" fill="#febc2e"/>
    <circle cx="124" cy="92" r="6" fill="#28c840"/>
    <rect x="250" y="84" width="140" height="16" rx="8" fill="#1b2c4d"/>
    <text x="320" y="96" font-family="monospace" font-size="11" fill="#7d8db0" text-anchor="middle">app.controller.js</text>

    <!-- número de líneas -->
    <g font-family="monospace" font-size="13">
      <g fill="#46598a">
        <text x="86" y="140">1</text><text x="86" y="166">2</text><text x="86" y="192">3</text>
        <text x="86" y="218">4</text><text x="86" y="244">5</text><text x="86" y="270">6</text>
        <text x="86" y="296">7</text><text x="86" y="322">8</text><text x="86" y="348">9</text>
        <text x="82" y="374">10</text>
      </g>
    </g>

    <!-- código (tokens) -->
    <g font-family="monospace" font-size="13.5">
      <!-- l1 -->
      <text x="116" y="140"><tspan fill="#c792ea">const</tspan><tspan fill="#d6deeb"> </tspan><tspan fill="#82aaff">app</tspan><tspan fill="#d6deeb"> = </tspan><tspan fill="#82aaff">angular</tspan><tspan fill="#d6deeb">.</tspan><tspan fill="#e5c07b">module</tspan><tspan fill="#d6deeb">(</tspan><tspan fill="#c3e88d">'portfolio'</tspan><tspan fill="#d6deeb">);</tspan></text>
      <!-- l2 -->
      <text x="116" y="166"><tspan fill="#82aaff">app</tspan><tspan fill="#d6deeb">.</tspan><tspan fill="#e5c07b">controller</tspan><tspan fill="#d6deeb">(</tspan><tspan fill="#c3e88d">'Main'</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c792ea">function</tspan><tspan fill="#d6deeb"> ($scope) {</tspan></text>
      <!-- l3 -->
      <text x="140" y="192"><tspan fill="#7d8db0">// servicios que ofrezco</tspan></text>
      <!-- l4 -->
      <text x="140" y="218"><tspan fill="#82aaff">$scope</tspan><tspan fill="#d6deeb">.</tspan><tspan fill="#f78c6c">skills</tspan><tspan fill="#d6deeb"> = [</tspan><tspan fill="#c3e88d">'C#'</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">'SQL'</tspan><tspan fill="#d6deeb">, </tspan><tspan fill="#c3e88d">'Angular'</tspan><tspan fill="#d6deeb">];</tspan></text>
      <!-- l5 -->
      <text x="140" y="244"><tspan fill="#82aaff">$scope</tspan><tspan fill="#d6deeb">.</tspan><tspan fill="#e5c07b">build</tspan><tspan fill="#d6deeb"> = () => {</tspan></text>
      <!-- l6 -->
      <text x="164" y="270"><tspan fill="#c792ea">return</tspan><tspan fill="#d6deeb"> </tspan><tspan fill="#c3e88d">'software confiable'</tspan><tspan fill="#d6deeb">;</tspan></text>
      <!-- l7 -->
      <text x="140" y="296"><tspan fill="#d6deeb">};</tspan></text>
      <!-- l8 -->
      <text x="116" y="322"><tspan fill="#d6deeb">});</tspan></text>
      <!-- l9 -->
      <text x="116" y="348"><tspan fill="#7d8db0">// MI Technologies — 8+ años</tspan></text>
      <!-- l10 cursor -->
      <text x="116" y="374"><tspan fill="#82aaff">deploy</tspan><tspan fill="#d6deeb">();</tspan></text>
      <rect x="172" y="362" width="8" height="16" fill="#c2a14d">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- chips flotantes -->
  <g filter="url(#shadow)">
    <rect x="430" y="350" width="150" height="58" rx="14" fill="#0f1d33" stroke="#28406b" stroke-width="1.5"/>
    <circle cx="460" cy="379" r="16" fill="#c2a14d" opacity="0.18"/>
    <path d="M454 379 l4 4 l8 -9" stroke="#d8b864" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="486" y="375" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#eaeefb">Producción</text>
    <text x="486" y="392" font-family="'Segoe UI',sans-serif" font-size="11" fill="#7d8db0">build OK</text>
  </g>
</svg>
