<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Gestor de inventario">
  <defs><linearGradient id="iv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13243f"/><stop offset="1" stop-color="#0a1424"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#iv)"/>
  <circle cx="160" cy="110" r="150" fill="#c2a14d" opacity="0.11"/>
  <!-- panel de inventario -->
  <g transform="translate(210,80)">
