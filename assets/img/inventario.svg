    <rect x="0" y="0" width="380" height="46" rx="14" fill="#16294a"/>
    <text x="22" y="29" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#eaeefb">Existencias</text>
    <rect x="300" y="14" width="62" height="18" rx="9" fill="#c2a14d"/>
    <!-- filas con cantidad -->
    <g transform="translate(22,64)" font-family="'Segoe UI',sans-serif">
      <!-- fila 1 -->
      <rect x="0" y="0" width="36" height="36" rx="6" fill="#24406f"/>
      <rect x="48" y="6" width="150" height="9" rx="4" fill="#2b4470"/><rect x="48" y="22" width="90" height="7" rx="3" fill="#1d3360"/>
      <rect x="270" y="6" width="66" height="26" rx="6" fill="#0a1424"/><text x="303" y="24" font-size="13" font-weight="700" fill="#28c840" text-anchor="middle">128</text>
      <!-- fila 2 -->
      <g transform="translate(0,52)">
        <rect x="0" y="0" width="36" height="36" rx="6" fill="#24406f"/>
        <rect x="48" y="6" width="120" height="9" rx="4" fill="#2b4470"/><rect x="48" y="22" width="110" height="7" rx="3" fill="#1d3360"/>
        <rect x="270" y="6" width="66" height="26" rx="6" fill="#0a1424"/><text x="303" y="24" font-size="13" font-weight="700" fill="#febc2e" text-anchor="middle">14</text>
      </g>
      <!-- fila 3 -->
      <g transform="translate(0,104)">
        <rect x="0" y="0" width="36" height="36" rx="6" fill="#24406f"/>
        <rect x="48" y="6" width="160" height="9" rx="4" fill="#2b4470"/><rect x="48" y="22" width="80" height="7" rx="3" fill="#1d3360"/>
        <rect x="270" y="6" width="66" height="26" rx="6" fill="#0a1424"/><text x="303" y="24" font-size="13" font-weight="700" fill="#ff5f57" text-anchor="middle">0</text>
      </g>
      <!-- fila 4 -->
      <g transform="translate(0,156)">
        <rect x="0" y="0" width="36" height="36" rx="6" fill="#24406f"/>
        <rect x="48" y="6" width="140" height="9" rx="4" fill="#2b4470"/><rect x="48" y="22" width="100" height="7" rx="3" fill="#1d3360"/>
        <rect x="270" y="6" width="66" height="26" rx="6" fill="#0a1424"/><text x="303" y="24" font-size="13" font-weight="700" fill="#28c840" text-anchor="middle">76</text>
      </g>
    </g>
